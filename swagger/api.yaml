openapi: 3.0.0
info:
  title: Social Media API
  description: |
    Social Media Backend API built with NestJS and MongoDB.
    This API provides authentication, user management, posts, comments, stories, groups, pages, and messaging functionality.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: App
    description: Application health and info endpoints
  - name: Auth
    description: Authentication and authorization endpoints
  - name: Users
    description: User management endpoints
  - name: Posts
    description: Post management endpoints
  - name: Comments
    description: Comment management endpoints
  - name: Stories
    description: Story management endpoints
  - name: Groups
    description: Group management endpoints
  - name: Pages
    description: Page management endpoints
  - name: Messages
    description: Messaging endpoints
  - name: Friend Requests
    description: Friend request management endpoints

paths:
  /:
    get:
      tags:
        - App
      summary: Get API information
      description: Returns API welcome message and available endpoints
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  version:
                    type: string
                  endpoints:
                    type: object

  /health:
    get:
      tags:
        - App
      summary: Health check
      description: Returns API health status
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - username
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: password123
                username:
                  type: string
                  example: johndoe
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
      responses:
        '201':
          description: User created successfully
        '400':
          description: Bad request
        '409':
          description: User already exists

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticates a user and returns JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Refreshes the access token using a refresh token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid refresh token

  /auth/profile:
    get:
      tags:
        - Auth
      summary: Get user profile
      description: Returns the authenticated user's profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

    patch:
      tags:
        - Auth
      summary: Update user profile
      description: Updates the authenticated user's profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                bio:
                  type: string
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profile updated successfully
        '401':
          description: Unauthorized

  /auth/auth-code:
    patch:
      tags:
        - Auth
      summary: Update authentication code
      description: Updates the user's authentication code
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - authCode
              properties:
                authCode:
                  type: string
      responses:
        '200':
          description: Auth code updated successfully
        '401':
          description: Unauthorized

  /auth/verify:
    get:
      tags:
        - Auth
      summary: Verify token
      description: Verifies if the current JWT token is valid
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  user:
                    type: object
        '401':
          description: Invalid token

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Returns a list of all users with pagination
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      tags:
        - Users
      summary: Create a new user
      description: Creates a new user (admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: User created successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Returns a specific user by their ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

    patch:
      tags:
        - Users
      summary: Update user
      description: Updates a user's information
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found

    delete:
      tags:
        - Users
      summary: Delete user
      description: Deletes a user account
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found

  /posts:
    get:
      tags:
        - Posts
      summary: Get all posts
      description: Returns a list of all posts with pagination
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

    post:
      tags:
        - Posts
      summary: Create a new post
      description: Creates a new post
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePost'
      responses:
        '201':
          description: Post created successfully
        '401':
          description: Unauthorized

  /posts/user/{userId}:
    get:
      tags:
        - Posts
      summary: Get posts by user
      description: Returns all posts by a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of user posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Get post by ID
      description: Returns a specific post by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found

    patch:
      tags:
        - Posts
      summary: Update post
      description: Updates a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePost'
      responses:
        '200':
          description: Post updated successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Post not found

    delete:
      tags:
        - Posts
      summary: Delete post
      description: Deletes a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Post not found

  /posts/{id}/like:
    post:
      tags:
        - Posts
      summary: Like a post
      description: Likes or unlikes a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post liked/unliked successfully
        '401':
          description: Unauthorized
        '404':
          description: Post not found

  /posts/{id}/share:
    post:
      tags:
        - Posts
      summary: Share a post
      description: Shares a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post shared successfully
        '401':
          description: Unauthorized
        '404':
          description: Post not found

  /posts/{id}/repost:
    post:
      tags:
        - Posts
      summary: Repost a post
      description: Creates a repost of an existing post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption:
                  type: string
      responses:
        '201':
          description: Repost created successfully
        '401':
          description: Unauthorized
        '404':
          description: Post not found

  /posts/upload:
    post:
      tags:
        - Posts
      summary: Upload files for posts
      description: Uploads images or videos for posts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Files uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        originalName:
                          type: string
                        size:
                          type: integer
                        type:
                          type: string
                          enum: [image, video]

  /comments:
    get:
      tags:
        - Comments
      summary: Get all comments
      description: Returns a list of all comments
      parameters:
        - name: postId
          in: query
          schema:
            type: string
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'

    post:
      tags:
        - Comments
      summary: Create a new comment
      description: Creates a new comment on a post
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComment'
      responses:
        '201':
          description: Comment created successfully
        '401':
          description: Unauthorized

  /comments/{id}:
    get:
      tags:
        - Comments
      summary: Get comment by ID
      description: Returns a specific comment by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          description: Comment not found

    patch:
      tags:
        - Comments
      summary: Update comment
      description: Updates a comment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
      responses:
        '200':
          description: Comment updated successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Comment not found

    delete:
      tags:
        - Comments
      summary: Delete comment
      description: Deletes a comment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Comment not found

  /comments/{id}/like:
    post:
      tags:
        - Comments
      summary: Like a comment
      description: Likes or unlikes a comment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment liked/unliked successfully
        '401':
          description: Unauthorized
        '404':
          description: Comment not found

  /stories:
    get:
      tags:
        - Stories
      summary: Get all stories
      description: Returns a list of all stories with pagination
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Story'

    post:
      tags:
        - Stories
      summary: Create a new story
      description: Creates a new story
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStory'
      responses:
        '201':
          description: Story created successfully
        '401':
          description: Unauthorized

  /stories/user/{userId}:
    get:
      tags:
        - Stories
      summary: Get stories by user
      description: Returns all stories by a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of user stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Story'

  /stories/{id}:
    get:
      tags:
        - Stories
      summary: Get story by ID
      description: Returns a specific story by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Story found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '404':
          description: Story not found

    delete:
      tags:
        - Stories
      summary: Delete story
      description: Deletes a story
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Story deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Story not found

  /stories/{id}/view:
    post:
      tags:
        - Stories
      summary: View a story
      description: Marks a story as viewed by the current user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Story viewed successfully
        '401':
          description: Unauthorized
        '404':
          description: Story not found

  /friend-requests:
    get:
      tags:
        - Friend Requests
      summary: Get friend requests
      description: Returns friend requests for the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [sent, received]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected]
      responses:
        '200':
          description: List of friend requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendRequest'
        '401':
          description: Unauthorized

    post:
      tags:
        - Friend Requests
      summary: Send friend request
      description: Sends a friend request to another user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - receiverId
              properties:
                receiverId:
                  type: string
      responses:
        '201':
          description: Friend request sent successfully
        '401':
          description: Unauthorized
        '400':
          description: Bad request

  /friend-requests/{id}:
    patch:
      tags:
        - Friend Requests
      summary: Respond to friend request
      description: Accepts or rejects a friend request
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
      responses:
        '200':
          description: Friend request updated successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Friend request not found

    delete:
      tags:
        - Friend Requests
      summary: Cancel friend request
      description: Cancels a sent friend request
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Friend request cancelled successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Friend request not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        bio:
          type: string
        avatar:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUser:
      type: object
      required:
        - email
        - password
        - username
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        bio:
          type: string

    UpdateUser:
      type: object
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        bio:
          type: string

    Post:
      type: object
      properties:
        _id:
          type: string
        author:
          $ref: '#/components/schemas/User'
        content:
          type: string
        media:
          type: array
          items:
            type: string
        likes:
          type: array
          items:
            type: string
        shares:
          type: integer
        comments:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePost:
      type: object
      required:
        - content
      properties:
        content:
          type: string
        media:
          type: array
          items:
            type: string
        groupId:
          type: string
        pageId:
          type: string

    UpdatePost:
      type: object
      properties:
        content:
          type: string
        media:
          type: array
          items:
            type: string

    Comment:
      type: object
      properties:
        _id:
          type: string
        post:
          type: string
        author:
          $ref: '#/components/schemas/User'
        content:
          type: string
        likes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateComment:
      type: object
      required:
        - postId
        - content
      properties:
        postId:
          type: string
        content:
          type: string

    Story:
      type: object
      properties:
        _id:
          type: string
        author:
          $ref: '#/components/schemas/User'
        media:
          type: string
        views:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreateStory:
      type: object
      required:
        - media
      properties:
        media:
          type: string
        caption:
          type: string

    FriendRequest:
      type: object
      properties:
        _id:
          type: string
        sender:
          $ref: '#/components/schemas/User'
        receiver:
          $ref: '#/components/schemas/User'
        status:
          type: string
          enum: [pending, accepted, rejected]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
